services:
  imgli:
    image: ghcr.io/yixian-huang/imgli:v0.10.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8686"
    environment:
      IMGLI_LISTEN: :8686
      IMGLI_DATA_DIR: /data
      IMGLI_BASE_URL: "${IMGLI_BASE_URL}"
      IMGLI_TRUST_PROXY: "${IMGLI_TRUST_PROXY}"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - "-qO-"
        - http://127.0.0.1:8686/healthz
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
